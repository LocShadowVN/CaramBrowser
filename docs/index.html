<!DOCTYPE html>
<html lang="vi" data-theme="dark" data-lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vibird Browser — Trình Duyệt Desktop Siêu Nhẹ Cho Linux</title>
  <meta name="description" content="Trình duyệt desktop Linux viết 100% bằng Rust và WebKitGTK 4.1. Nhẹ máy, không ngốn RAM, tích hợp sẵn chặn quảng cáo Brave 300k rules và tải file đa luồng kiểu IDM." />

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       DESIGN SYSTEM & THEME PALETTES
       ========================================================================== */
    :root {
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, monospace;

      --brand-amber: #f59e0b;
      --brand-bronze: #d97706;
      --brand-caramel: #ea580c;
      --cyan-core: #38bdf8;
      --emerald-shield: #10b981;

      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
    }

    /* DARK THEME */
    html[data-theme="dark"] {
      --bg: #07090e;
      --bg-subtle: #0d1118;
      --surface: #131823;
      --surface-hover: #19202f;
      --surface-glass: rgba(19, 24, 35, 0.75);
      --border: #1f2737;
      --border-strong: #2f3b52;
      --border-accent: rgba(245, 158, 11, 0.35);

      --text: #f8fafc;
      --text-muted: #94a3b8;
      --text-faint: #475569;

      --glow-caramel: rgba(234, 88, 12, 0.18);
      --glow-cyan: rgba(56, 189, 248, 0.15);
      --shadow-ambient: 0 24px 60px -12px rgba(0, 0, 0, 0.85);
      --card-shine: radial-gradient(circle at 50% 0%, rgba(245, 158, 11, 0.12), transparent 70%);
    }

    /* LIGHT THEME */
    html[data-theme="light"] {
      --bg: #f8fafc;
      --bg-subtle: #f1f5f9;
      --surface: #ffffff;
      --surface-hover: #f1f5f9;
      --surface-glass: rgba(255, 255, 255, 0.85);
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --border-accent: rgba(217, 119, 6, 0.4);

      --text: #0f172a;
      --text-muted: #64748b;
      --text-faint: #94a3b8;

      --glow-caramel: rgba(245, 158, 11, 0.15);
      --glow-cyan: rgba(2, 132, 199, 0.1);
      --shadow-ambient: 0 20px 48px -10px rgba(15, 23, 42, 0.08);
      --card-shine: radial-gradient(circle at 50% 0%, rgba(245, 158, 11, 0.08), transparent 70%);
    }

    /* Language toggling rules */
    html[data-lang="vi"] .lang-en { display: none !important; }
    html[data-lang="en"] .lang-vi { display: none !important; }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      background-color: var(--bg);
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 28px;
      position: relative;
      z-index: 2;
    }

    .bg-mesh {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 1400px;
      height: 700px;
      background: radial-gradient(ellipse at 50% 0%, var(--glow-caramel) 0%, var(--glow-cyan) 40%, transparent 75%);
      pointer-events: none;
      z-index: 0;
      opacity: 0.85;
    }

    /* Top Release Announcement Banner */
    .top-banner {
      background: linear-gradient(90deg, rgba(245, 158, 11, 0.12) 0%, rgba(56, 189, 248, 0.08) 100%);
      border-bottom: 1px solid var(--border);
      padding: 8px 16px;
      font-size: 13px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(16px);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 10px;
      border-radius: 99px;
      background: rgba(245, 158, 11, 0.18);
      border: 1px solid rgba(245, 158, 11, 0.35);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      color: var(--brand-amber);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--brand-amber);
      box-shadow: 0 0 8px var(--brand-amber);
      animation: pulseGlow 1.8s infinite ease-in-out;
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    /* Sticky Navbar */
    nav {
      position: sticky;
      top: 37px;
      z-index: 90;
      background: var(--surface-glass);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }

    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 68px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text);
    }

    .brand-icon-wrap {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-sm);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px var(--glow-caramel);
    }

    .brand-title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-tag {
      font-size: 10px;
      font-family: var(--font-mono);
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--surface-hover);
      color: var(--cyan-core);
      border: 1px solid var(--border);
    }

    .nav-links {
      display: flex;
      gap: 28px;
      list-style: none;
    }
    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: color 0.15s ease;
    }
    .nav-links a:hover {
      color: var(--text);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .ctrl-pill {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 7px 12px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-family: var(--font-mono);
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .ctrl-pill:hover {
      color: var(--text);
      border-color: var(--border-strong);
      background: var(--surface-hover);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 9px 18px;
      border-radius: var(--radius-sm);
      font-size: 13.5px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      border: 1px solid transparent;
    }

    .btn-primary {
      background: linear-gradient(135deg, #f59e0b 0%, #ea580c 100%);
      color: #ffffff;
      box-shadow: 0 4px 18px rgba(234, 88, 12, 0.35);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(234, 88, 12, 0.5);
    }

    .btn-ghost {
      background: var(--surface);
      border-color: var(--border);
      color: var(--text);
    }
    .btn-ghost:hover {
      background: var(--surface-hover);
      border-color: var(--border-strong);
      transform: translateY(-1px);
    }

    /* Hero Section */
    .hero {
      padding: 80px 0 60px;
      text-align: center;
    }

    .hero-badges {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 24px;
    }

    .tag-chip {
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 5px 12px;
      border-radius: 99px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .tag-chip.accent {
      color: var(--brand-amber);
      border-color: var(--border-accent);
      background: rgba(245, 158, 11, 0.1);
    }

    h1.hero-title {
      font-size: 54px;
      font-weight: 800;
      letter-spacing: -2px;
      line-height: 1.18;
      margin-bottom: 22px;
      max-width: 920px;
      margin-left: auto;
      margin-right: auto;
    }

    .gradient-text {
      background: linear-gradient(135deg, #f59e0b 0%, #f97316 50%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-desc {
      font-size: 18px;
      color: var(--text-muted);
      max-width: 800px;
      margin: 0 auto 36px;
      line-height: 1.7;
    }

    .hero-actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 40px;
    }

    /* Terminal Quick Box */
    .terminal-box {
      max-width: 680px;
      margin: 0 auto 70px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-ambient);
      text-align: left;
    }

    .terminal-header {
      background: var(--bg-subtle);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .term-tabs {
      display: flex;
      gap: 8px;
    }

    .term-tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 5px;
      cursor: pointer;
    }
    .term-tab-btn.active {
      background: var(--surface);
      color: var(--brand-amber);
    }

    .terminal-body {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 13px;
    }

    .terminal-code {
      color: var(--text);
      white-space: nowrap;
      overflow-x: auto;
      padding-right: 12px;
    }
    .terminal-code .prompt {
      color: var(--brand-amber);
      margin-right: 8px;
      font-weight: bold;
    }

    /* Mockup */
    .mockup-wrap {
      max-width: 1060px;
      margin: 0 auto;
    }

    .browser-frame {
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-ambient);
    }

    .frame-chrome {
      background: var(--bg-subtle);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
    }

    .tab-strip {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
    }

    .window-dots {
      display: flex;
      gap: 6px;
      margin-right: 12px;
    }
    .window-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
    }
    .dot-close { background: #ef4444; }
    .dot-min { background: #f59e0b; }
    .dot-max { background: #10b981; }

    .mock-tab {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-family: var(--font-mono);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .mock-tab.active {
      background: var(--surface);
      color: var(--text);
      border-color: var(--border);
      font-weight: 600;
    }
    .mock-tab.snoozed {
      opacity: 0.6;
      border-style: dashed;
      border-color: var(--border-strong);
    }

    .address-bar-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-arrows {
      display: flex;
      gap: 4px;
      color: var(--text-faint);
    }

    .mock-omnibox {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      height: 36px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 12.5px;
      color: var(--text);
    }

    .badge-shield-live {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.15);
      color: var(--emerald-shield);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
    }

    .frame-content {
      padding: 44px;
      background: var(--bg);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .metric-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }
    .metric-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--brand-amber), var(--cyan-core));
    }
    .metric-card .num {
      font-family: var(--font-mono);
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -1.5px;
      color: var(--text);
      margin-bottom: 6px;
    }
    .metric-card .label {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Bento Grid */
    .section-title-wrap {
      margin-bottom: 48px;
    }
    .section-eyebrow {
      font-family: var(--font-mono);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--brand-amber);
      font-weight: 700;
      margin-bottom: 8px;
    }
    .section-heading {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 12px;
    }
    .section-sub {
      color: var(--text-muted);
      font-size: 16px;
      max-width: 680px;
    }

    .bento-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      margin-bottom: 100px;
    }

    .bento-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 32px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.25s ease;
    }
    .bento-item::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--card-shine);
      pointer-events: none;
    }
    .bento-item:hover {
      transform: translateY(-4px);
      border-color: var(--border-strong);
      box-shadow: var(--shadow-ambient);
    }
    .bento-item.span-2 {
      grid-column: span 2;
    }

    .bento-icon {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-sm);
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 22px;
      color: var(--brand-amber);
    }

    .bento-item h3 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.4px;
      margin-bottom: 10px;
    }
    .bento-item p {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.7;
    }
    .bento-tag {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      color: var(--cyan-core);
      text-transform: uppercase;
      margin-top: 20px;
    }

    /* Benchmarks */
    .benchmarks-section {
      padding: 60px 0 100px;
