name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-lint:
    name: Check & Lint Codebase
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            src-tauri
            frontend
            shared

      - name: Install Pre-built Trunk
        run: |
          wget -qO- https://github.com/trunk-rs/trunk/releases/download/v0.21.5/trunk-x86_64-unknown-linux-gnu.tar.gz | sudo tar -xzf- -C /usr/local/bin
          trunk --version

      - name: Auto Format Code
        run: cargo fmt --all || true
        
      - name: Generate App Icons
        run: |
          mkdir -p src-tauri/icons
          echo 'iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAALUlEQVRYR+3QQREAAAzCQNq/9KXhAQ9wQO6Sb3qgB6AHegB6oAegB3oAeqAHvh6gLwFf6l4FSAAAAABJRU5ErkJggg==' | base64 -d > src-tauri/icons/icon.png
          cp src-tauri/icons/icon.png src-tauri/icons/32x32.png
          cp src-tauri/icons/icon.png src-tauri/icons/128x128.png
          cp src-tauri/icons/icon.png src-tauri/icons/128x128@2x.png
          cp src-tauri/icons/icon.png src-tauri/icons/icon.ico


      - name: Verify Frontend WASM Compilation
        run: |
          cd frontend
          trunk build --release
          
      - name: Pin rmp dependency
        run: cargo update -p rmp --precise 0.8.11 || true

      - name: Run Clippy Linter on Entire Workspace
        run: cargo clippy --workspace --all-targets

      - name: Run Tests
        run: cargo test --workspace
